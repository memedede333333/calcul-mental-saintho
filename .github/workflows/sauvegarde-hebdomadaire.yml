# =====================================================================
# Sauvegarde hebdomadaire Supabase (Sentinelle Cloud)
# =====================================================================
# Ce workflow s'exécute chaque vendredi à 18h17 UTC (après la classe).
# 1. Se connecte à Supabase via le secret SUPABASE_DB_URL.
# 2. Exécute pg_dump pour extraire le schéma public complet et les données.
# 3. Contrôle rigoureusement le dump (taille > 20 Ko, tables clés, nb élèves).
# 4. Échoue exprès (exit 1) en cas d'anomalie pour envoyer l'alerte e-mail GitHub.
# 5. Archive le fichier compressé .sql.gz dans les artefacts chiffrés de GitHub.
# =====================================================================

name: Sauvegarde hebdomadaire Supabase

on:
  schedule:
    # Chaque vendredi à 18h17 UTC (après la semaine de cours)
    - cron: '17 18 * * 5'
  workflow_dispatch:

jobs:
  sauvegarde:
    name: Extraction & Contrôles de validation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les outils PostgreSQL 17
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Exécuter le dump Supabase et valider l'intégrité
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DB_URL}" ]; then
            echo "::error::Le secret SUPABASE_DB_URL n'est pas renseigné dans GitHub Secrets."
            exit 1
          fi

          # Nettoyage des retours à la ligne ou espaces accidentels dans le secret
          DB_URL=$(echo "${DB_URL}" | tr -d '\r\n ')

          DATE_STR=$(date +"%Y-%m-%d_%Hh%M")
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "inconnu")

          LAST_MIG="00"
          if [ -d "supabase/migrations" ]; then
            LAST_MIG_FILE=$(ls supabase/migrations/*.sql 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "${LAST_MIG_FILE}" ]; then
              LAST_MIG=$(basename "${LAST_MIG_FILE}" | cut -d '_' -f1)
            fi
          fi

          BACKUP_BASE="matho_db_${DATE_STR}_mig-${LAST_MIG}_git-${GIT_COMMIT}"
          RAW_COMPLET="${BACKUP_BASE}_complet.sql"
          RAW_DONNEES="${BACKUP_BASE}_donnees.sql"
          TMP_DATA="tmp_data_$$.sql"

          echo "Extraction pg_dump 1/2 : Complet…"
          pg_dump "${DB_URL}" \
            --schema=public \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --file="${RAW_COMPLET}"

          echo "Extraction pg_dump 2/2 : Données seules (prêt pour restauration)…"
          pg_dump "${DB_URL}" \
            --schema=public \
            --data-only \
            --no-owner \
            --no-privileges \
            --file="${TMP_DATA}"

          # Envelopper les données pour session_replication_role
          {
            echo "-- Matho — Données seules pour restauration (RESTAURATION.md Étape 3)"
            echo "-- Migration : ${LAST_MIG} | Commit : ${GIT_COMMIT} | Date : ${DATE_STR}"
            echo "SET session_replication_role = replica;"
            cat "${TMP_DATA}"
            echo "SET session_replication_role = default;"
          } > "${RAW_DONNEES}"
          rm -f "${TMP_DATA}"

          # --- CONTRÔLES DE VALIDATION STRICTS ---
          echo "Vérification de l'intégrité du dump…"

          if [ ! -f "${RAW_COMPLET}" ] || [ ! -f "${RAW_DONNEES}" ]; then
            echo "::error::Les fichiers de dump n'ont pas été générés."
            exit 1
          fi

          FILE_SIZE=$(wc -c < "${RAW_COMPLET}" | tr -d ' ')
          DATA_SIZE=$(wc -c < "${RAW_DONNEES}" | tr -d ' ')
          if [ "${FILE_SIZE}" -lt 20000 ] || [ "${DATA_SIZE}" -lt 20000 ]; then
            echo "::error::ALERTE : Dump anormalement petit (${FILE_SIZE} octets). Sauvegarde vide ou tronquée."
            exit 1
          fi

          for TABLE in "eleves" "sessions_jeu" "maitrise" "defis"; do
            if ! grep -q -E "(COPY public\.${TABLE}|INSERT INTO public\.${TABLE})" "${RAW_DONNEES}"; then
              echo "::error::ALERTE : Table capitale 'public.${TABLE}' introuvable dans le dump."
              exit 1
            fi
          done

          NB_ELEVES=0
          if grep -q "COPY public\.eleves " "${RAW_DONNEES}"; then
            NB_ELEVES=$(sed -n '/COPY public\.eleves /,/\\\./p' "${RAW_DONNEES}" | grep -v '^COPY' | grep -v '^\\\.' | wc -l | tr -d ' ')
          fi

          if [ "${NB_ELEVES}" -lt 250 ]; then
            echo "::error::ALERTE : Population d'élèves anormale dans le dump (${NB_ELEVES} élèves comptés, minimum 250 requis)."
            exit 1
          fi

          echo "✅ Intégrité validée : complet (${FILE_SIZE} octets), données (${DATA_SIZE} octets), ${NB_ELEVES} élèves présents."

          # Compression
          gzip -c "${RAW_COMPLET}" > "${BACKUP_BASE}_complet.sql.gz"
          gzip -c "${RAW_DONNEES}" > "${BACKUP_BASE}_donnees.sql.gz"
          rm -f "${RAW_COMPLET}" "${RAW_DONNEES}"

          echo "BACKUP_BASE=${BACKUP_BASE}" >> $GITHUB_ENV

      - name: Archiver la sauvegarde dans GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_BASE }}
          path: |
            ${{ env.BACKUP_BASE }}_complet.sql.gz
            ${{ env.BACKUP_BASE }}_donnees.sql.gz
          retention-days: 90
