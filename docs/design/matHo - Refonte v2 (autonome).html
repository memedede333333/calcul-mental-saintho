document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b64a1a7d-e384-43cd-85d3-c74fda0763f9\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\n:root{\n  --navy:#20226B; --ink:#1A1C55; --navy-soft:#3A3F86;\n  --ivory:#FAF6EE; --surface:#FFFFFF; --border:#E4DED2; --muted:#6E7391;\n  --sky:#23A4D9; --sky-soft:#DDF0FA; --mint:#018F4B; --mint-soft:#DDEFE4;\n  --coral:#E02020; --coral-soft:#FBE3E3; --red-pale:#E4736F;\n  --sun:#F38E1A; --sun-soft:#FBE8D2; --podium:#E8A33A;\n  --display:\"Baloo 2\",\"Nunito\",ui-rounded,\"SF Pro Rounded\",system-ui,sans-serif;\n  --sans:\"Nunito\",ui-rounded,\"SF Pro Rounded\",system-ui,sans-serif;\n}\nbody{margin:0;background:#EFEAE0;font-family:var(--sans);color:var(--ink);text-wrap:pretty}\na{color:var(--sky);text-decoration:none}\na:hover{color:var(--navy)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"padding:72px 80px 40px;display:flex;flex-direction:column;gap:44px\">\n  <div id=\"6a\" style=\"display:flex;flex-direction:column;gap:40px\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1060px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"background:#20226B;color:#fff;font:700 15px var(--sans);padding:5px 12px;border-radius:999px;letter-spacing:.06em\">6a<\u002Fspan>\n        <span style=\"color:#6E7391;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase\">L'entraînement libre — le mode où se joue le synaptique<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font:700 50px var(--display);color:#20226B;letter-spacing:-.01em\">Pas de chrono affiché, mais le temps mesuré<\u002Fh1>\n      <p style=\"margin:0;font:400 20px/1.5 var(--sans);color:#3A3F86;max-width:960px\">Le mode libre existe dans le code (<code style=\"font-family:ui-monospace,monospace;font-size:18px;background:#F1ECE2;padding:2px 7px;border-radius:6px\">libre<\u002Fcode>, 10 questions par défaut, aucun timer) et j'en avais fait une simple vignette. C'est une erreur : c'est le seul mode où l'objectif que tu m'as donné — construire la récupération rapide, pas seulement la restitution — peut réellement se travailler. Quatre écrans.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 480px;background:#20226B;border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#fff\">Le temps, mais jamais en compte à rebours<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">C'est la règle déjà écrite dans <code style=\"font-family:ui-monospace,monospace;font-size:15px;color:#fff\">ECRANS.md<\u002Fcode>, et elle est juste : en libre, aucun chrono ne tourne pendant que l'élève cherche. Mais le temps est <b style=\"color:#fff\">affiché après<\u002Fb> chaque réponse — « ✓ 2,4 s » — et moyenné en fin de partie.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">C'est exactement la distinction qui compte : un compte à rebours mesure la résistance au stress, un temps affiché après coup mesure <b style=\"color:#fff\">l'automatisation<\u002Fb>. Le second est ce que tu cherches à construire, et il ne fait peur à personne.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">D'où le grand chiffre de fin de partie : ce n'est pas un score, c'est <b style=\"color:#fff\">2,6 s par question<\u002Fb>, comparé à la semaine dernière. Un élève qui passe de 4,1 s à 2,6 s sans gagner un seul point a pourtant énormément progressé — aucun autre écran ne sait le lui dire.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 480px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">La reprise espacée, dans la partie<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\">Une multiplication ratée ne disparaît pas : elle revient <b>trois questions plus tard<\u002Fb>, puis <b>une dernière fois vers la fin<\u002Fb>. Deux intervalles, courts, à l'intérieur d'une seule partie — c'est la répétition espacée à l'échelle où elle est gratuite à construire : rien à stocker côté serveur, tout tient dans la file de questions de la partie en cours.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\">La bande « À retravailler » montre cette file en clair, avec la couleur de chaque fait : rouge encore ratée, orange reprise une fois, verte réussie. L'élève voit son propre travail se réduire.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>Le seuil des 3 secondes<\u002Fb> décide de la couleur : une case ne passe au vert qu'après deux réussites d'affilée sous 3 s. Une bonne réponse en 8 s n'est pas une case sue, c'est un calcul réussi — et la grille doit dire la différence, sinon elle mesure la patience.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#6E7391\">Le serveur reçoit déjà tout ce qu'il faut pour ça : <code style=\"font-family:ui-monospace,monospace;font-size:15px\">maitrise<\u002Fcode> accepte 1, 2 ou 3 par fait. C'est l'écran qui décide du niveau, et le temps est le bon critère.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 480px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Cinq choses en plus, à valider<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>Le choix des tables reste ouvert<\u002Fb> (écran 21) : autant de tables que l'élève veut, avec sa maîtrise sous chaque chiffre et le nombre de cases à revoir. « Mes cases rouges » n'est qu'un raccourci vers une sélection qu'il peut toujours modifier — jamais une contrainte.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>« Sans fin »<\u002Fb> à côté de 10 et 20 questions. Un entraînement libre qui s'arrête tout seul au bout de dix questions interrompt un élève lancé. Il arrête quand il veut, la partie s'enregistre à l'arrêt.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>« Mes cases rouges »<\u002Fb> comme choix par défaut, pas « toutes les tables ». L'élève qui s'entraîne sait rarement sur quoi il devrait s'entraîner — <code style=\"font-family:ui-monospace,monospace;font-size:15px\">mesTablesFaibles()<\u002Fcode> le sait pour lui.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>« Ma dernière table »<\u002Fb>, celle qu'il vient de débloquer par la Montée. Le code lui dit déjà « tu peux maintenant t'entraîner sur la table 11 en mode libre » — autant que ce soit un bouton et pas une phrase.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>Aucun point, et c'est dit d'entrée.<\u002Fb> « Le seul mode où tu peux te tromper sans que ça compte » en sous-titre. Un élève qui craint de dégrader sa moyenne ne s'entraîne pas là où il est faible, et c'est précisément là qu'il faut qu'il aille.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start\">\n      <div data-screen-label=\"18 · Entraînement libre — ce qu'on travaille\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:700 20px var(--display);color:#20226B\">18 · Entraînement libre — ce qu'on travaille<\u002Fdiv>\n        <div style=\"width:834px;height:1194px;background:#FAF6EE;border-radius:46px;border:10px solid #20226B;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:700 15px var(--sans);color:#6E7391\"><span>17:40<\u002Fspan><span>Wi‑Fi · 74 %<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:8px 34px 0;display:flex;align-items:center;justify-content:space-between\">\n            <div style=\"font:700 21px var(--sans);color:#3A3F86\">‹ Retour<\u002Fdiv>\n            <div style=\"font:600 17px var(--sans);color:#6E7391\">Pas de chrono, pas de score<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 34px 0;display:flex;flex-direction:column;gap:4px\">\n            <h2 style=\"margin:0;font:700 40px var(--display);color:#20226B\">S'entraîner<\u002Fh2>\n            <div style=\"font:600 18px var(--sans);color:#6E7391\">Le seul mode où tu peux te tromper sans que ça compte.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:24px 34px 0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 16px var(--sans);color:#6E7391;letter-spacing:.14em;text-transform:uppercase\">Sur quoi<\u002Fdiv>\n            <div style=\"background:#23A4D9;border-radius:24px;padding:22px 24px;display:flex;align-items:center;gap:18px\">\n              <div style=\"display:grid;grid-template-columns:repeat(3,16px);gap:4px;flex:none\">\n                <div style=\"width:16px;height:16px;border-radius:4px;background:#fff\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:#fff\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.4)\"><\u002Fdiv><div style=\"width:16px;height:16px;border-radius:4px;background:#fff\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font:700 27px var(--display);color:#fff\">Mes 21 cases rouges<\u002Fdiv>\n                <div style=\"font:600 16px var(--sans);color:#DFF2FB\">Tables de 7, 8 et 9 · c'est là que ça bloque<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-left:auto;width:34px;height:34px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none\">\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5 10 17.5 19 7\" stroke=\"#23A4D9\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <div style=\"flex:1;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\">\n                <div style=\"font:700 22px var(--display);color:#20226B\">Mes tables<\u002Fdiv>\n                <div style=\"font:600 15px var(--sans);color:#9A93A8\">j'en choisis autant que je veux<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\">\n                <div style=\"font:700 22px var(--display);color:#20226B\">Tout mélangé<\u002Fdiv>\n                <div style=\"font:600 15px var(--sans);color:#9A93A8\">tables 2 à 10<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\">\n                <div style=\"font:700 22px var(--display);color:#20226B\">Ma dernière<\u002Fdiv>\n                <div style=\"font:600 15px var(--sans);color:#9A93A8\">table de 10, ouverte hier<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:24px 34px 0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 16px var(--sans);color:#6E7391;letter-spacing:.14em;text-transform:uppercase\">Combien de temps<\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <div style=\"flex:1;height:92px;border-radius:22px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px\"><span style=\"font:700 30px var(--display);color:#20226B\">10<\u002Fspan><span style=\"font:600 15px var(--sans);color:#9A93A8\">questions<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;height:92px;border-radius:22px;background:#20226B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px\"><span style=\"font:700 30px var(--display);color:#fff\">20<\u002Fspan><span style=\"font:600 15px var(--sans);color:#A9AFDE\">questions<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;height:92px;border-radius:22px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px\"><span style=\"font:700 26px var(--display);color:#20226B\">Sans fin<\u002Fspan><span style=\"font:600 15px var(--sans);color:#9A93A8\">j'arrête quand je veux<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:24px 34px 0;background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font:700 21px var(--display);color:#20226B\">Ce que ce mode fait de tes erreurs<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <div style=\"width:40px;height:40px;border-radius:12px;background:#FBE3E3;display:flex;align-items:center;justify-content:center;font:700 18px var(--display);color:#B34141;flex:none\">1<\u002Fdiv>\n              <div style=\"font:600 17px/1.4 var(--sans);color:#3A3F86\">Tu te trompes : la bonne réponse s'affiche, tu la retapes.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <div style=\"width:40px;height:40px;border-radius:12px;background:#FBE8D2;display:flex;align-items:center;justify-content:center;font:700 18px var(--display);color:#8A5A10;flex:none\">2<\u002Fdiv>\n              <div style=\"font:600 17px/1.4 var(--sans);color:#3A3F86\">La même multiplication revient <b>trois questions plus tard<\u002Fb>.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <div style=\"width:40px;height:40px;border-radius:12px;background:#DDEFE4;display:flex;align-items:center;justify-content:center;font:700 18px var(--display);color:#0C6B3D;flex:none\">3<\u002Fdiv>\n              <div style=\"font:600 17px/1.4 var(--sans);color:#3A3F86\">Si tu l'as, elle revient <b>une dernière fois<\u002Fb> vers la fin. Deux réussites d'affilée et la case change de couleur.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1\"><\u002Fdiv>\n\n          <div style=\"padding:0 34px 30px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font:600 17px var(--sans);color:#6E7391;text-align:center\">21 cases rouges · 20 questions · sans chrono · tables modifiables<\u002Fdiv>\n            <div style=\"height:104px;border-radius:26px;background:#23A4D9;color:#fff;font:700 29px var(--sans);display:flex;align-i    <\u002Fdiv><div style=\"height:126px;border-radius:24px;background:#23A4D9;box-shadow:0 10px 24px rgba(35,164,217,.28);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative\">\n                <div style=\"position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5 10 17.5 19 7\" stroke=\"#23A4D9\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <span style=\"font:700 40px var(--display);color:#fff\">7<\u002Fspan>\n                <div style=\"width:78px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:rgba(255,255,255,.3)\">\n                  <div style=\"width:10%;background:#fff\"><\u002Fdiv><div style=\"width:10%;background:rgba(255,255,255,.55)\"><\u002Fdiv><div style=\"width:80%;background:rgba(255,255,255,.25)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px var(--sans);color:#DFF2FB\">8 rouges<\u002Fspan>\n              <\u002Fdiv><div style=\"height:126px;border-radius:24px;background:#23A4D9;box-shadow:0 10px 24px rgba(35,164,217,.28);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative\">\n                <div style=\"position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5 10 17.5 19 7\" stroke=\"#23A4D9\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <span style=\"font:700 40px var(--display);color:#fff\">8<\u002Fspan>\n                <div style=\"width:78px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:rgba(255,255,255,.3)\">\n                  <div style=\"width:15%;background:#fff\"><\u002Fdiv><div style=\"width:15%;background:rgba(255,255,255,.55)\"><\u002Fdiv><div style=\"width:70%;background:rgba(255,255,255,.25)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px var(--sans);color:#DFF2FB\">7 rouges<\u002Fspan>\n              <\u002Fdiv><div style=\"height:126px;border-radius:24px;background:#23A4D9;box-shadow:0 10px 24px rgba(35,164,217,.28);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative\">\n                <div style=\"position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5 10 17.5 19 7\" stroke=\"#23A4D9\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <span style=\"font:700 40px var(--display);color:#fff\">9<\u002Fspan>\n                <div style=\"width:78px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:rgba(255,255,255,.3)\">\n                  <div style=\"width:20%;background:#fff\"><\u002Fdiv><div style=\"width:20%;background:rgba(255,255,255,.55)\"><\u002Fdiv><div style=\"width:60%;background:rgba(255,255,255,.25)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px var(--sans);color:#DFF2FB\">6 rouges<\u002Fspan>\n              <\u002Fdiv><div style=\"height:126px;border-radius:24px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative\">\n                \n                <span style=\"font:700 40px var(--display);color:#20226B\">10<\u002Fspan>\n                <div style=\"width:78px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:#EDE7DC\">\n                  <div style=\"width:85%;background:#018F4B\"><\u002Fdiv><div style=\"width:15%;background:#F38E1A\"><\u002Fdiv><div style=\"width:0%;background:#E02020\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px var(--sans);color:#9A93A8\">rien à revoir<\u002Fspan>\n              <\u002Fdiv>\n            <div style=\"height:126px;border-radius:24px;background:#F2EDE3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px\">\n              <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"9.5\" rx=\"2.5\" stroke=\"#9A93A8\" stroke-width=\"2.4\"><\u002Frect><path d=\"M8 10.5V8a4 4 0 0 1 8 0v2.5\" stroke=\"#9A93A8\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font:700 36px var(--display);color:#B3ACBE\">11<\u002Fspan>\n              <span style=\"font:600 14px var(--sans);color:#B3ACBE\">par la Montée<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:20px 34px 0;background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;gap:16px\">\n            <div style=\"width:10px;height:44px;border-radius:5px;background:#23A4D9;flex:none\"><\u002Fdiv>\n            <div style=\"font:600 17px/1.45 var(--sans);color:#3A3F86\">Sur 3 tables cochées, <b style=\"color:#20226B\">21 cases sur 30<\u002Fb> te posent encore problème. Ce sont elles qui tomberont le plus souvent.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1\"><\u002Fdiv>\n\n          <div style=\"padding:0 34px 30px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font:600 17px var(--sans);color:#6E7391;text-align:center\">Tables 7, 8 et 9 · 20 questions · sans chrono<\u002Fdiv>\n            <div style=\"height:104px;border-radius:26px;background:#23A4D9;color:#fff;font:700 29px var(--sans);display:flex;align-items:center;justify-content:center\">Commencer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"5a\" style=\"display:flex;flex-direction:column;gap:40px\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1060px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"background:#20226B;color:#fff;font:700 15px var(--sans);padding:5px 12px;border-radius:999px;letter-spacing:.06em\">5a<\u002Fspan>\n        <span style=\"color:#6E7391;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase\">Passe sur le code réel — accueil, premier jour, création de défi<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font:700 50px var(--display);color:#20226B;letter-spacing:-.01em\">Cinq erreurs de maquette, et trois choses que l'API sait déjà faire<\u002Fh1>\n      <p style=\"margin:0;font:400 20px/1.5 var(--sans);color:#3A3F86;max-width:960px\">J'ai relu <code style=\"font-family:ui-monospace,monospace;font-size:18px;background:#F1ECE2;padding:2px 7px;border-radius:6px\">api.js<\u002Fcode>, <code style=\"font-family:ui-monospace,monospace;font-size:18px;background:#F1ECE2;padding:2px 7px;border-radius:6px\">Home.jsx<\u002Fcode> et les migrations. Mes écrans précédents inventaient des choses que le serveur ne renvoie pas, et ignoraient des fonctions déjà écrites qu'aucun écran n'appelle. Voici les trois écrans corrigés.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 480px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Ce que je corrige dans mes propres maquettes<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>1. La grille n'est pas 12 × 12.<\u002Fb> Elle se dimensionne sur <code style=\"font-family:ui-monospace,monospace;font-size:15px\">plafond_tables<\u002Fcode>. Pour Lou, plafond 10 : cent cases, pas 144. Une grille 12 × 12 affiche des multiplications qu'elle n'a pas le droit de jouer — et « 41 sur 144 » devient un chiffre faux.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>2. Il y a six modes, pas quatre.<\u002Fb> <code style=\"font-family:ui-monospace,monospace;font-size:15px\">enregistrerSession<\u002Fcode> accepte libre, apprentissage, sprint, flawless, countdown, climb. Libre et Apprendre existent et ne figuraient nulle part chez moi.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>3. Le palier est calculé, pas choisi.<\u002Fb> Découverte jusqu'à 5, Confirmé jusqu'à 10, Expert au‑delà — dérivé du plafond. Rien à inventer, et rien d'autre à afficher : <code style=\"font-family:ui-monospace,monospace;font-size:15px\">tables_autorisees<\u002Fcode> est une colonne fossile.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>4. Aucun champ de texte libre, nulle part.<\u002Fb> Mon champ « CODE » en pointillés ressemblait à une zone de saisie clavier. Il devient <b>cinq cases<\u002Fb> remplies par un pavé de lettres — même principe que les cases de réponse du jeu.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>5. Les points viennent de <code style=\"font-family:ui-monospace,monospace;font-size:15px\">records.points_total<\u002Fcode><\u002Fb>, chargé par <code style=\"font-family:ui-monospace,monospace;font-size:15px\">monProfil()<\u002Fcode> — donc l'accueil doit tenir debout pendant que ce chiffre est encore à zéro.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 480px;background:#20226B;border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#fff\">Trois fonctions écrites, jamais appelées<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">apercuDefiClasse(classe, tables)<\u002Fb> — elle répond à « combien d'élèves n'ont pas la plus haute table choisie ». C'est l'avertissement le plus utile de toute l'application côté prof, et il n'est affiché nulle part. Je l'ai mis à l'écran 17, juste au‑dessus du bouton, avec l'action qui va avec : ouvrir la table à la classe en une fois (<b style=\"color:#fff\">definirPlafondClasse<\u002Fb>, elle aussi disponible).<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">mesTablesFaibles(4)<\u002Fb> — c'est elle qui doit écrire « Aujourd'hui », plutôt qu'un comptage de rouges fait dans l'écran. Le serveur sait déjà quelles tables sont les plus ratées.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">partiesEnAttente()<\u002Fb> et <b style=\"color:#fff\">surFileChangee()<\u002Fb> — la file hors‑ligne existe, avec son abonnement. Une ligne discrète en bas de l'accueil suffit : « 1 partie en attente d'envoi ». Sans elle, l'élève qui a joué dans un couloir sans wifi croit avoir perdu sa partie.<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#8E93C6\">Une quatrième, plus tard : <code style=\"font-family:ui-monospace,monospace;font-size:15px\">rejoindreDefi<\u002Fcode> distingue <b style=\"color:#fff\">deja_joue<\u002Fb> des autres refus. Ce cas‑là mérite un bouton « Voir le classement », pas un message d'erreur.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 480px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:13px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Le premier jour, la base est vierge<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\">Le jour de la mise en service, tous les élèves ouvrent un accueil sans grille, sans points, sans table faible. C'est l'état que l'application montrera à trois cents personnes le même matin, et c'est celui qu'on dessine en dernier d'habitude. L'écran 16 le traite en premier.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\">La grille vide n'est pas cachée : elle est montrée en gris, avec sa légende. Elle sert d'explication de l'outil — cent cases à retourner — au lieu d'un texte de bienvenue.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\">Une seule action est ouverte, <b>une partie libre sur les tables 2 à 5<\u002Fb>. Les modes chronométrés sont grisés : ils n'ont aucun sens avant de savoir ce que l'élève sait. Et le choix de l'avatar est proposé là, parce que c'est le seul champ qu'il peut modifier — autant le lui dire tout de suite.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#6E7391\">Question ouverte : ouvrir les modes après <b>une<\u002Fb> partie libre, ou après un nombre de questions atteint ? Je penche pour une partie, mais c'est ton terrain.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start\">\n      <div data-screen-label=\"15 · Accueil élève — corrigé sur l'API\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:700 20px var(--display);color:#20226B\">15 · Accueil élève — corrigé sur l'API<\u002Fdiv>\n        <div style=\"width:834px;height:1194px;background:#FAF6EE;border-radius:46px;border:10px solid #20226B;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:
