ght=\"8\" rx=\"2.5\" stroke=\"#20226B\" stroke-width=\"3\"><\u002Frect><rect x=\"18\" y=\"31\" width=\"11\" height=\"8\" rx=\"2.5\" stroke=\"#20226B\" stroke-width=\"3\"><\u002Frect><\u002Fsvg><span style=\"font:700 19px var(--sans);color:#20226B\">Profil<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-screen-label=\"17 · Créer un défi — avec l'aperçu de classe\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:700 20px var(--display);color:#20226B\">17 · Créer un défi — avec l'aperçu de classe<\u002Fdiv>\n        <div style=\"width:834px;height:1194px;background:#FAF6EE;border-radius:46px;border:10px solid #20226B;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:700 15px var(--sans);color:#6E7391\"><span>08:20<\u002Fspan><span>Wi‑Fi · 50 %<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:10px 34px 0;display:flex;align-items:center;justify-content:space-between\">\n            <div style=\"font:700 21px var(--sans);color:#3A3F86\">‹ Accueil<\u002Fdiv>\n            <div style=\"font:600 17px var(--sans);color:#6E7391\">Étape 3 sur 3<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 34px 0;display:flex;flex-direction:column;gap:4px\">\n            <h2 style=\"margin:0;font:700 40px var(--display);color:#20226B\">Lancer un défi<\u002Fh2>\n            <div style=\"font:600 18px var(--sans);color:#6E7391\">Le code s'affichera en grand pour la classe.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:24px 34px 0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 16px var(--sans);color:#6E7391;letter-spacing:.14em;text-transform:uppercase\">Le mode<\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <div style=\"flex:1;background:#23A4D9;border-radius:22px;padding:20px;display:flex;align-items:center;gap:14px\">\n                <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 44 44\" fill=\"none\" style=\"flex:none\"><path d=\"M24 4 10 25h9l-2 15 15-22h-9z\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <div><div style=\"font:700 24px var(--display);color:#fff\">Sprint<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#DFF2FB\">20 questions · 3 s<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;gap:14px\">\n                <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 44 44\" fill=\"none\"><circle cx=\"22\" cy=\"25\" r=\"15\" stroke=\"#20226B\" stroke-width=\"3.4\"><\u002Fcircle><path d=\"M22 16v9l6 4\" stroke=\"#23A4D9\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M17 5h10M22 5v5\" stroke=\"#20226B\" stroke-width=\"3.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <div><div style=\"font:700 24px var(--display);color:#20226B\">Contre‑la‑montre<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#9A93A8\">2 minutes<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 15px var(--sans);color:#9A93A8\">Sans faute et Montée ne sont pas proposés : les durées varient trop pour une classe entière.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 34px 0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 16px var(--sans);color:#6E7391;letter-spacing:.14em;text-transform:uppercase\">Les tables<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:10px\">\n              <div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">2<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">3<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">4<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">5<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">6<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#23A4D9;display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#fff\">7<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#23A4D9;display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#fff\">8<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#23A4D9;display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#fff\">9<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">10<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">11<\u002Fdiv><div style=\"height:76px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;justify-content:center;font:700 32px var(--display);color:#20226B\">12<\u002Fdiv>\n              <div style=\"height:76px;border-radius:18px;background:#F2EDE3;display:flex;align-items:center;justify-content:center;font:700 28px var(--display);color:#B3ACBE\">13<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 34px 0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 16px var(--sans);color:#6E7391;letter-spacing:.14em;text-transform:uppercase\">La classe<\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <div style=\"flex:1;background:#20226B;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:2px\"><div style=\"font:700 26px var(--display);color:#fff\">6ᵉA<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#A9AFDE\">27 élèves<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\"><div style=\"font:700 26px var(--display);color:#20226B\">6ᵉB<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#9A93A8\">26 élèves<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\"><div style=\"font:700 26px var(--display);color:#20226B\">5ᵉC<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#9A93A8\">28 élèves<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:2px\"><div style=\"font:700 22px var(--display);color:#3A3F86\">Sans classe<\u002Fdiv><div style=\"font:600 15px var(--sans);color:#9A93A8\">code seul<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:22px 34px 0;background:#FBE8D2;border-radius:24px;padding:22px 24px;display:flex;align-items:flex-start;gap:16px\">\n            <div style=\"width:10px;align-self:stretch;border-radius:5px;background:#F38E1A;flex:none\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <div style=\"font:700 23px var(--display);color:#8A5A10\">4 élèves de 6ᵉA n'ont pas encore la table de 9<\u002Fdiv>\n              <div style=\"font:600 16px/1.45 var(--sans);color:#9C6A22\">Ils pourront jouer le défi — les questions au‑delà de leur plafond ne compteront pas contre eux. Tu peux aussi retirer la table de 9, ou leur ouvrir la 9 en une action.<\u002Fdiv>\n              <div style=\"display:flex;gap:18px;padding-top:4px\">\n                <div style=\"font:700 17px var(--sans);color:#8A5A10\">Ouvrir la table de 9 à toute la classe ›<\u002Fdiv>\n                <div style=\"font:700 17px var(--sans);color:#8A5A10\">Voir qui ›<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1\"><\u002Fdiv>\n\n          <div style=\"padding:0 34px 30px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font:600 17px var(--sans);color:#6E7391;text-align:center\">Sprint · tables 7, 8, 9 · 6ᵉA · 20 questions<\u002Fdiv>\n            <div style=\"height:104px;border-radius:26px;background:#23A4D9;color:#fff;font:700 29px var(--sans);display:flex;align-items:center;justify-content:center\">Créer le défi et projeter le code<\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"4a\" style=\"display:flex;flex-direction:column;gap:40px\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1060px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"background:#20226B;color:#fff;font:700 15px var(--sans);padding:5px 12px;border-radius:999px;letter-spacing:.06em\">4a<\u002Fspan>\n        <span style=\"color:#6E7391;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase\">Le compromis · la comm' en clair · l'animation « 56 »<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font:700 50px var(--display);color:#20226B;letter-spacing:-.01em\">Un seul emplacement, trois états<\u002Fh1>\n      <p style=\"margin:0;font:400 20px/1.5 var(--sans);color:#3A3F86;max-width:960px\">Ma recommandation : ne pas choisir entre <a href=\"#2a\">2a<\u002Fa> et <a href=\"#3a\">3a<\u002Fa>. Le défi de classe n'est pas une carte de plus, c'est <b>un emplacement fixe<\u002Fb> — toujours au même endroit, juste sous la grille — dont le contenu change selon qu'il y a un défi ou non. L'élève apprend une position, pas trois écrans.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 480px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Pourquoi pas deux accueils différents<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">Si le bandeau du défi pousse tout le reste vers le bas les jours de défi, l'élève ne mémorise jamais où se trouve quoi. À la place, l'ordre est <b>toujours<\u002Fb> le même : nom, grille, emplacement défi, action du jour, modes, Montée.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">L'emplacement fait la même hauteur dans les trois cas, donc rien ne bouge d'un jour à l'autre. Ce qui change, c'est son contenu — et sa couleur, qui suffit à dire s'il y a quelque chose à faire.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">Le champ de code reste visible <b>en permanence<\u002Fb>, même à l'état repos : c'est le geste que le professeur demande à voix haute, il ne doit jamais être à chercher. Il est simplement discret quand il ne sert pas.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#6E7391\">Un défi interrompu prime sur un défi neuf ; s'il y en a deux en attente, le plus récent s'affiche et le second devient « +1 autre défi ›».<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 480px;background:#20226B;border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#fff\">La comm', en clair cette fois<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">Je répondais à deux questions à la fois, c'était confus. Ce que je propose tient en trois phrases.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">1. Pas de slogan à l'intérieur de l'application.<\u002Fb> Une fois l'élève connecté, chaque mot lui dit quoi faire ou où il en est. Pas de « Deviens un champion du calcul ! » en haut de l'accueil.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">2. Trois endroits portent le nom et le logo, et trois seulement :<\u002Fb> l'écran de connexion, le code projeté au tableau, la fin de partie. Ce sont les trois moments où quelqu'un d'autre que l'élève regarde l'écran — un parent derrière l'épaule, la classe entière, l'élève content de lui.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">3. On écrit des constats, jamais des compliments.<\u002Fb> « 41 cases sur 144 », « +6 cette semaine », « 12 cases rouges ». Jamais « Bravo » ni « Continue comme ça ». Un chiffre juste motive davantage qu'un encouragement, et surtout il reste crédible le jour où l'application annonce une mauvaise nouvelle.<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#8E93C6\">Concrètement pour toi : une seule phrase à écrire, celle de l'écran de connexion. Le reste est une règle de rédaction à tenir.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font:700 20px var(--display);color:#20226B\">13 · L'emplacement « Défi de classe » <span style=\"color:#6E7391;font:600 16px var(--sans)\">— largeur réelle, à insérer sous la grille de l'écran 12<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:flex;gap:26px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 17px var(--sans);color:#6E7391\">État 1 · aucun défi <span style=\"font-weight:600;color:#9A93A8\">— le plus fréquent<\u002Fspan><\u002Fdiv>\n          <div style=\"width:834px;background:#FAF6EE;border-radius:24px;padding:20px 36px\">\n            <div style=\"background:#fff;border-radius:24px;padding:20px 24px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;align-items:center;gap:18px\">\n              <div style=\"font:700 20px var(--sans);color:#3A3F86;white-space:nowrap\">Défi de classe<\u002Fdiv>\n              <div style=\"flex:1;height:74px;border-radius:18px;border:3px dashed #DCD5C7;display:flex;align-items:center;justify-content:center;font:700 26px var(--sans);color:#B8B0A2;letter-spacing:.34em\">CODE<\u002Fdiv>\n              <div style=\"height:74px;padding:0 34px;border-radius:18px;background:#EDE7DC;color:#9A93A8;font:700 22px var(--sans);display:flex;align-items:center\">Rejoindre<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:10px 6px 0;font:600 16px var(--sans);color:#9A93A8\">Ton professeur te donnera un code à cinq lettres.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 17px var(--sans);color:#6E7391\">État 2 · un défi t'attend <span style=\"font-weight:600;color:#9A93A8\">— code déjà rempli, l'élève n'a plus qu'à partir<\u002Fspan><\u002Fdiv>\n          <div style=\"width:834px;background:#FAF6EE;border-radius:24px;padding:20px 36px\">\n            <div style=\"background:#23A4D9;border-radius:24px;padding:22px 26px;display:flex;align-items:center;gap:20px\">\n              <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 44 44\" fill=\"none\" style=\"flex:none\"><path d=\"M24 4 10 25h9l-2 15 15-22h-9z\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font:700 27px var(--display);color:#fff\">Défi de M. Desjardins<\u002Fdiv>\n                <div style=\"font:600 17px var(--sans);color:#DFF2FB\">Sprint · tables 6 à 9 · code <span style=\"letter-spacing:.16em\">UEWTR<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-left:auto;height:74px;padding:0 32px;border-radius:18px;background:#fff;color:#23A4D9;font:700 23px var(--sans);display:flex;align-items:center;white-space:nowrap\">Commencer<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:10px 6px 0;display:flex;align-items:center;justify-content:space-between\">\n              <div style=\"font:600 16px var(--sans);color:#6E7391\">Reçu il y a 20 minutes.<\u002Fdiv>\n              <div style=\"font:600 16px var(--sans);color:#23A4D9\">Saisir un autre code ›<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 17px var(--sans);color:#6E7391\">État 3 · défi commencé, pas fini <span style=\"font-weight:600;color:#9A93A8\">— indigo : c'est une dette, pas une invitation<\u002Fspan><\u002Fdiv>\n          <div style=\"width:834px;background:#FAF6EE;border-radius:24px;padding:20px 36px\">\n            <div style=\"background:#20226B;border-radius:24px;padding:22px 26px;display:flex;align-items:center;gap:20px\">\n              <div style=\"width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none\">\n                <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 44 44\" fill=\"none\"><circle cx=\"22\" cy=\"25\" r=\"15\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle><path d=\"M22 16v9l6 4\" stroke=\"#23A4D9\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M17 5h10M22 5v5\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font:700 27px var(--display);color:#fff\">Défi <span style=\"letter-spacing:.16em\">UEWTR<\u002Fspan> — tu l'as quitté en route<\u002Fdiv>\n                <div style=\"font:600 17px var(--sans);color:#A9AFDE\">Contre‑la‑montre · 6ᵉA · il reprend à la première question<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-left:auto;height:74px;padding:0 32px;border-radius:18px;background:#23A4D9;color:#fff;font:700 23px var(--sans);display:flex;align-items:center;white-space:nowrap\">Reprendre<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:10px 6px 0;font:600 16px var(--sans);color:#6E7391\">18 camarades sur 27 l'ont terminé.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font:700 20px var(--display);color:#20226B\">14 · L'animation d'entrée — « 56 » <span style=\"color:#6E7391;font:600 16px var(--sans)\">— esquisse, six étapes, 1,4 s<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 18px/1.5 var(--sans);color:#3A3F86;max-width:1040px\">Les deux mains du logo font le geste que les élèves font déjà — paumes ouvertes qui pèsent, gauche puis droite. Sauf qu'ici elles pèsent vraiment : la gauche tient 7, la droite tient 8, et elles se rejoignent sur <b>56<\u002Fb>, le nombre déjà présent dans le logo. C'est aussi le produit que les collégiens retiennent le plus mal : l'animation ne montre pas un exemple au hasard, elle montre la difficulté centrale de l'application, une fois par connexion, sans un mot d'explication.<\u002Fp>\n      <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#6E7391;max-width:1040px\">Le geste vient du « six seven » que les élèves font entre eux — il leur sera familier sans qu'on l'explique — mais l'animation ne le cite pas : elle pèse 7 et 8. Un adulte y voit deux mains qui soupèsent deux nombres, un élève y reconnaît le geste. Les mains sont ici de simples esquisses ; il faudra les redessiner d'après celles du logo.<\u002Fp>\n\n      <div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">1<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">Retour de Google<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">0–150 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;display:flex;align-items:center;justify-content:center\">\n            <div style=\"width:104px;height:104px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center\"><img src=\"be866b8d-0723-4b96-b6cf-8f435c9f8221\" alt=\"\" style=\"width:74px;height:74px;object-fit:contain\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">Le logo, seul, sur l'indigo — la même image que l'écran de connexion. La bascule est invisible : rien n'a l'air de s'être passé.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">2<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">Les mains sortent<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">150–400 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;display:flex;align-items:center;justify-content:center;gap:16px\">\n            <svg width=\"86\" height=\"86\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n            <svg width=\"86\" height=\"86\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"transform:scaleX(-1)\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">Le logo se dissout, ses deux mains restent et descendent d'un cran, paumes ouvertes vers le haut, à la même hauteur.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">3<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">La gauche pèse 7<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">400–640 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;display:flex;align-items:center;justify-content:center;gap:16px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(-20px)\">\n              <span style=\"font:700 44px var(--display);color:#fff\">8<\u002Fspan>\n              <svg width=\"80\" height=\"80\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n            <\u002Fdiv>\n            <svg width=\"80\" height=\"80\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"transform:scaleX(-1) translateY(20px);opacity:.5\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">La main gauche monte de 20 px, la droite descend d'autant. Un 7 se pose au-dessus de la gauche. Le rebond est franc, pas fluide — c'est un geste, pas une transition.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">4<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">La droite pèse 8<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">640–880 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;display:flex;align-items:center;justify-content:center;gap:16px\">\n            <svg width=\"80\" height=\"80\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"transform:translateY(20px);opacity:.5\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(-20px)\">\n              <span style=\"font:700 44px var(--display);color:#fff\">8<\u002Fspan>\n              <svg width=\"80\" height=\"80\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"transform:scaleX(-1)\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">Les mains s'inversent, le 7 s'efface, un 8 se pose au-dessus de la droite. Le geste peut boucler tant que Google n'a pas répondu — c'est là que se loge l'attente.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">5<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">Elles se rejoignent<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">880–1100 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\">\n            <div style=\"font:700 54px var(--display);color:#fff\">56<\u002Fdiv>\n            <div style=\"display:flex;gap:2px\">\n              <svg width=\"74\" height=\"74\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n              <svg width=\"74\" height=\"74\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"transform:scaleX(-1)\"><g transform=\"translate(4,10)\"><rect x=\"16\" y=\"40\" width=\"56\" height=\"34\" rx=\"15\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"18\" y=\"22\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"33\" y=\"18\" width=\"12\" height=\"30\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"48\" y=\"20\" width=\"12\" height=\"28\" rx=\"6\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"62\" y=\"27\" width=\"11\" height=\"21\" rx=\"5.5\" fill=\"#F6D2B4\"><\u002Frect><rect x=\"4\" y=\"47\" width=\"20\" height=\"11\" rx=\"5.5\" fill=\"#EFC4A2\"><\u002Frect><\u002Fg><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font:600 15px var(--sans);color:#A9AFDE\">7 × 8<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">Les deux paumes se rapprochent, les nombres fusionnent : 56 apparaît au-dessus, « 7 × 8 » en petit dessous — le nombre du logo, obtenu sous les yeux de l'élève.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:284px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:700 25px var(--display);color:#23A4D9\">6<\u002Fspan><span style=\"font:700 17px var(--sans);color:#20226B\">L'accueil monte<\u002Fspan><span style=\"margin-left:auto;font:600 13px var(--sans);color:#9A93A8\">1100–1400 ms<\u002Fspan><\u002Fdiv>\n          <div style=\"height:206px;border-radius:16px;background:#20226B;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end\">\n            <div style=\"padding:0 0 6px;text-align:center;font:700 26px var(--display);color:rgba(255,255,255,.35)\">56<\u002Fdiv>\n            <div style=\"background:#FAF6EE;border-radius:18px 18px 0 0;padding:14px 16px;display:flex;flex-direction:column;gap:8px;height:132px\">\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:#DDF0FA;display:flex;align-items:center;justify-content:center;font-size:15px\">🦊<\u002Fdiv>\n                <div style=\"font:700 16px var(--display);color:#20226B\">Bonsoir Lou<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:7px;gap:2px\">\n                <div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#E4DED2\"><\u002Fdiv>\n                <div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#E4DED2\"><\u002Fdiv><div style=\"border-radius:2px;background:#E4DED2\"><\u002Fdiv>\n                <div style=\"border-radius:2px;background:#018F4B\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#E02020\"><\u002Fdiv><div style=\"border-radius:2px;background:#F38E1A\"><\u002Fdiv><div style=\"border-radius:2px;background:#E4DED2\"><\u002Fdiv><div style=\"border-radius:2px;background:#E4DED2\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:26px;border-radius:8px;background:#23A4D9\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 15px/1.5 var(--sans);color:#3A3F86\">L'accueil glisse par le bas et recouvre la scène ; le 56 sort par le haut. Si Google a répondu avant, on saute directement ici — l'animation ne fait jamais attendre.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-top:4px\">\n        <div style=\"flex:1 1 460px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font:700 20px var(--display);color:#20226B\">Les règles qui vont avec<\u002Fh3>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\"><b>Elle ne retarde jamais l'entrée.<\u002Fb> Si la session est prête avant l'étape 5, on coupe à l'étape en cours et on enchaîne sur la 6. Le plancher est de 600 ms, sinon on ne voit qu'un clignotement.<\u002Fp>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\"><b>Si Google traîne au-delà de 2 s<\u002Fb>, le va-et-vient des mains continue en boucle et une ligne discrète apparaît sous les mains : « Connexion en cours ». Pas de rond qui tourne.<\u002Fp>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\"><b>Elle ne joue qu'à la connexion<\u002Fb>, pas à chaque ouverture de l'application. Une blague vue trois fois par jour n'est plus une blague.<\u002Fp>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\"><b>Le couple pesé change<\u002Fb> selon l'élève, une fois la première semaine passée : ce sont ses deux cases les plus rouges qui apparaissent dans les paumes. 56 reste le défaut, et le seul couple montré à un nouvel élève.<\u002Fp>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\"><b>Réglage « moins d'animations »<\u002Fb> du système respecté : les mains apparaissent à leur place finale, 56 s'affiche, on entre.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 380px;background:#FBF8F2;border:2px dashed #DCD5C7;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font:700 20px var(--display);color:#20226B\">Variante, si tu la trouves trop bavarde<\u002Fh3>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#3A3F86\">Même geste, sans les chiffres : les mains pèsent deux fois dans le vide, se rejoignent, et c'est le <b>logo<\u002Fb> qui se reforme entre elles avant que l'accueil monte. Le 56 reste, mais porté par le logo au lieu d'être calculé.<\u002Fp>\n          <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#6E7391\">Plus sobre, mais on perd le seul moment où l'application fait faire un calcul sans le demander.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"3a\" style=\"display:flex;flex-direction:column;gap:40px\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1060px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"background:#20226B;color:#fff;font:700 15px var(--sans);padding:5px 12px;border-radius:999px;letter-spacing:.06em\">3a<\u002Fspan>\n        <span style=\"color:#6E7391;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase\">Connexion · accueil d'un jour ordinaire<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font:700 50px var(--display);color:#20226B;letter-spacing:-.01em\">Savoir où on en est, avant de savoir quoi faire<\u002Fh1>\n      <p style=\"margin:0;font:400 20px/1.5 var(--sans);color:#3A3F86;max-width:960px\">L'accueil de <a href=\"#2a\">2a<\u002Fa> montrait un jour d'exception : un défi de classe en attente, le bandeau indigo mange le premier écran. La plupart des jours, il n'y a pas de défi. Il reste alors un élève qui ouvre l'application sans savoir où il en est — c'est ce vide que remplit l'écran 12.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 440px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Trois repères, dans cet ordre<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\"><b>Où j'en suis<\u002Fb> — la grille 12 × 12 en miniature, en haut, sous le nom. C'est la seule image de la maîtrise réelle, et elle est identique à celle du professeur. 41 cases vertes sur 144, l'élève voit sa surface verte grandir de semaine en semaine sans qu'on lui explique rien.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\"><b>Ce que je fais aujourd'hui<\u002Fb> — une seule proposition, pas quatre. « Table de 9, 12 cases rouges » : l'application a déjà décidé, l'élève n'a qu'à appuyer. Les quatre modes restent en dessous, plus petits, pour celui qui veut choisir.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\"><b>Où je vais<\u002Fb> — la Montée, palier 12 sur 15, et la table de 13 verrouillée au bout. C'est le seul horizon long de l'application ; il mérite une ligne à lui, pas une carte parmi d'autres.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 440px;background:#20226B;border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#fff\">Sur la communication — ce que j'en pense<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">Le nom porte déjà la promesse : <b style=\"color:#fff\">matHo<\u002Fb>, les maths et le geste des mains du logo. Je ne mettrais aucune baseline sur l'accueil élève. Un collégien n'a pas besoin qu'on lui vende l'outil une fois qu'il est dedans — il a besoin de savoir où appuyer. La communication se joue à la connexion et devant les parents, pas pendant.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">Là où je la placerais : <b style=\"color:#fff\">l'écran de connexion<\u002Fb> (une phrase, celle de l'écran 11), <b style=\"color:#fff\">le code projeté au tableau<\u002Fb> — c'est le seul moment où trente familles voient le logo en grand — et l'écran de fin de partie, qui est le seul endroit où l'élève est content.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">Le ton que je tiendrais partout : <b style=\"color:#fff\">on constate, on ne félicite pas<\u002Fb>. « 41 cases sur 144 » vaut mieux que « Bravo, continue comme ça ! ». Un collégien de 11 ans repère l'enthousiasme fabriqué en une seconde, et l'outil perd sa crédibilité — celle qui fait qu'on croit aussi le rouge quand il apparaît.<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#8E93C6\">À décider ensemble : y a‑t‑il une phrase officielle, validée par l'établissement, que je dois reprendre telle quelle sur l'écran de connexion ? J'ai mis une formule d'attente.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 440px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">L'animation d'après‑Google<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">Le retour de Google prend une à trois secondes qu'on ne maîtrise pas. Plutôt qu'un rond qui tourne, je remplirais ce temps avec la seule chose qui appartient à l'élève : <b>sa grille<\u002Fb>.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">Les 144 cases apparaissent grises en un huitième de seconde, puis se colorent par vagues diagonales — vert, orange, rouge — au rythme où les données arrivent. Quand la dernière case est posée, la grille se réduit et glisse à sa place en haut de l'accueil. Aucune coupure, aucun écran intermédiaire : le chargement <b>est<\u002Fb> l'arrivée.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#3A3F86\">Pour une première connexion, les 144 cases restent grises et une seule s'allume — 2 × 2. C'est la promesse de l'année, dite sans une phrase.<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.5 var(--sans);color:#6E7391\">Durée plancher 600 ms pour que ce soit lisible, plafond 2 s ; au‑delà la grille finit de se colorer toute seule et on entre. Je la construirai à la fin, comme convenu.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start\">\n\n      <div data-screen-label=\"Connexion\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:700 20px var(--display);color:#20226B\">11 · Connexion <span style=\"color:#6E7391;font:600 16px var(--sans)\">— élève et professeur, même écran<\u002Fspan><\u002Fdiv>\n        <div style=\"width:834px;height:1194px;background:#FAF6EE;border-radius:46px;border:10px solid #20226B;overflow:hidden;display:flex;flex-direction:column;position:relative\">\n          <div style=\"position:absolute;top:0;left:0;right:0;height:520px;background:#20226B;border-radius:0 0 60px 60px\"><\u002Fdiv>\n          <div style=\"position:absolute;top:150px;left:70px;width:24px;height:24px;border-radius:6px;background:#E02020;transform:rotate(16deg)\"><\u002Fdiv>\n          <div style=\"position:absolute;top:206px;left:126px;width:16px;height:16px;border-radius:4px;background:#F38E1A;transform:rotate(-14deg)\"><\u002Fdiv>\n          <div style=\"position:absolute;top:168px;right:84px;width:20px;height:20px;border-radius:5px;background:#23A4D9;transform:rotate(24deg)\"><\u002Fdiv>\n          <div style=\"position:absolute;top:238px;right:142px;width:14px;height:14px;border-radius:4px;background:#018F4B;transform:rotate(-6deg)\"><\u002Fdiv>\n\n          <div style=\"height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:700 15px var(--sans);color:#8E93C6;position:relative\"><span>08:02<\u002Fspan><span>Wi‑Fi · 92 %<\u002Fspan><\u002Fdiv>\n\n          <div style=\"position:relative;padding:104px 60px 0;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center\">\n            <div style=\"width:150px;height:150px;border-radius:38px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.22)\">\n              <img src=\"be866b8d-0723-4b96-b6cf-8f435c9f8221\" alt=\"matHo\" style=\"width:108px;height:108px;object-fit:contain\">\n            <\u002Fdiv>\n            <div style=\"font:700 68px var(--display);color:#fff;letter-spacing:-.01em\">matHo<\u002Fdiv>\n            <div style=\"font:600 26px/1.4 var(--sans);color:#A9AFDE;max-width:520px\">Les tables de multiplication, jusqu'à les savoir.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;margin:118px 60px 0;background:#fff;border-radius:32px;padding:40px 36px;box-shadow:0 14px 40px rgba(32,34,107,.14);display:flex;flex-direction:column;gap:22px\">\n            <div style=\"font:700 27px var(--display);color:#20226B;text-align:center\">Connexion avec ton compte du collège<\u002Fdiv>\n            <div style=\"height:104px;border-radius:22px;border:2px solid #E4DED2;background:#fff;display:flex;align-items:center;justify-content:center;gap:16px\">\n              <svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 48 48\"><path fill=\"#4285F4\" d=\"M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.8-2 5.1-4.4 6.7v5.6h7.1c4.2-3.8 6.6-9.5 6.6-16.5z\"><\u002Fpath><path fill=\"#34A853\" d=\"M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.8C8.1 41.2 15.5 46 24 46z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2 ichier, aucune bibliothèque appelée. Les avatars animaux et les emojis de fête restent tels quels.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 420px;background:#20226B;border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:16px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#fff\">La règle des tailles, pas les 132 px<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">Le pavé prend 44 % de la hauteur utile<\u002Fb>, quel que soit l'écran : 4 rangées + 3 gouttières de 16 px. Sur 1194 pt cela fait 132 px de touche, sur un iPad mini de 744 × 1133 environ 124 px.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">Plancher absolu : 88 px de haut, 96 px de large.<\u002Fb> En dessous, le pavé ne rétrécit plus — c'est la question qui cède.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\"><b style=\"color:#fff\">Ordre de compression<\u002Fb>, du premier au dernier : les marges verticales de la carte question (34 → 20 px), le chiffre de la question (116 → 88 px, jamais moins), les cases de saisie (126 → 104 px), la barre de série qui passe en compteur seul. Le pavé, lui, ne bouge qu'en dernier recours.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.55 var(--sans);color:#C7CCEA\">Largeur de touche = (largeur écran − 64 px de marges − 32 px de gouttières) ÷ 3. Le ⌫ garde sa gouttière doublée de 32 px, elle ne se comprime jamais : c'est elle qui empêche de le taper à la place du 0.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 420px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 8px 20px rgba(32,34,107,.10);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 24px var(--display);color:#20226B\">Les trois chiffres, corrigés<\u002Fh2>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>Le bandeau de reprise<\u002Fb> ne prétend plus rien savoir : « Défi UEWTR en cours · Contre-la-montre · 6ᵉA · le défi reprend à la première question ». La dernière clause n'est pas une donnée, c'est l'annonce du comportement — l'élève doit le savoir avant de toucher le bouton.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>« Ma classe » n'a plus qu'une unité par colonne<\u002Fb> : partout des élèves sur 27, jamais de pourcentage. Le titre de colonne le dit en toutes lettres au-dessus des barres.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:#3A3F86\"><b>« 24 ont joué cette semaine » a disparu.<\u002Fb> L'écran ne déduit aucune population : il ne reste que le nombre d'élèves de la classe et le nombre de tables travaillées.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start\">\n\n      <div data-screen-label=\"Accueil professeur\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:700 20px var(--display);color:#20226B\">6 · Accueil professeur <span style=\"color:#6E7391;font:600 16px var(--sans)\">— remplace l'écran actuel<\u002Fspan><\u002Fdiv>\n        <div style=\"width:834px;height:1194px;background:#FAF6EE;border-radius:46px;border:10px solid #20226B;overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:700 15px var(--sans);color:#6E7391\"><span>08:12<\u002Fspan><span>Wi‑Fi · 50 %<\u002Fspan><\u002Fdiv>\n\n          <div style=\"padding:10px 36px 0;display:flex;align-items:center;gap:16px\">\n            <img src=\"be866b8d-0723-4b96-b6cf-8f435c9f8221\" alt=\"matHo\" style=\"width:66px;height:66px;object-fit:contain\">\n            <div style=\"display:flex;flex-direction:column\">\n              <div style=\"font:700 34px var(--display);color:#20226B;letter-spacing:-.01 roke=\"#20226B\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n              <div style=\"min-width:0\"><div style=\"font:700 14px var(--sans);color:#1A1C55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">eleves-rentree-2026.csv<\u002Fdiv><div style=\"font:600 13px var(--sans);color:#6E7391\">350 lignes lues · email, nom, prenom, classe<\u002Fdiv><\u002Fdiv>\n              <span style=\"margin-left:auto;font:600 13px var(--sans);color:#23A4D9\">Changer<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"font:700 12px var(--sans);color:#6E7391;letter-spacing:.08em;text-transform:uppercase\">Ce qui sera écrit<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;border:1px solid #E4DED2;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 26px var(--display);color:#018F4B\">312<\u002Fspan><span style=\"font:600 13px var(--sans);color:#6E7391\">créés<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;border:1px solid #E4DED2;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 26px var(--display);color:#20226B\">34<\u002Fspan><span style=\"font:600 13px var(--sans);color:#6E7391\">mis à jour<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;border:1px solid #E4DED2;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 26px var(--display);color:#B34141\">4<\u002Fspan><span style=\"font:600 13px var(--sans);color:#6E7391\">ignorés<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #F0C9C9;background:#FDF3F3;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px\">\n              <div style=\"font:700 14px var(--sans);color:#8E1616\">4 lignes ignorées — elles ne seront pas écrites<\u002Fdiv>\n              <div style=\"font:600 13px/1.5 var(--sans);color:#7A4A4A\">L.  47 · e‑mail sans « @ » — <span style=\"color:#9A93A8\">m.dupont.college<\u002Fspan><br>L. 112 · classe vide<br>L. 203 · e‑mail déjà présent ligne 88<br>L. 288 · prénom manquant<\u002Fdiv>\n              <div style=\"font:600 13px var(--sans);color:#23A4D9\">Télécharger les 4 lignes ›<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #E4DED2;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font:700 14px var(--sans);color:#1A1C55\">6 élèves actifs sont absents du fichier<\u002Fdiv>\n              <div style=\"font:600 13px/1.5 var(--sans);color:#6E7391\">L'import ne désactive personne. Ils resteront actifs — à traiter un par un après coup.<\u002Fdiv>\n              <div style=\"font:600 13px var(--sans);color:#23A4D9\">Voir la liste ›<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1\"><\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"height:46px;border-radius:10px;background:#23A4D9;color:#fff;font:700 16px var(--sans);display:flex;align-items:center;justify-content:center\">Importer 346 lignes<\u002Fdiv>\n              <div style=\"font:600 12.5px/1.5 var(--sans);color:#6E7391;text-align:center\">Rien n'a encore été écrit. L'import s'exécute d'un bloc : s'il échoue, aucune ligne n'est créée.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:0 80px 120px;display:flex;flex-direction:column;gap:44px\">\n\n  <div id=\"1a\" style=\"display:flex;flex-direction:column;gap:44px\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1000px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"background:var(--navy);color:#fff;font:700 15px var(--sans);padding:5px 12px;border-radius:999px;letter-spacing:.06em\">1a<\u002Fspan>\n        <span style=\"color:var(--muted);font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase\">matHo — refonte visuelle et ergonomique<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font:700 54px var(--display);color:var(--navy);letter-spacing:-.01em\">Sobre au repos, éclatant à la réussite<\u002Fh1>\n      <p style=\"margin:0;font:400 21px/1.5 var(--sans);color:var(--navy-soft);max-width:940px\">Je reste dans l'univers du logo : encre marine, fond ivoire, un accent par contexte, et la mosaïque de carrés colorés du « 56 » comme unique motif — elle sert de série, de grille de maîtrise et de confettis. Aucune ressource extérieure, couleurs en variables CSS, cibles ≥ 96 px, portrait 834 × 1194.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:28px;flex-wrap:wrap;align-items:stretch\">\n      <div style=\"flex:1 1 460px;background:var(--surface);border-radius:28px;padding:32px;box-shadow:0 6px 16px rgba(32,34,107,.08);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 26px var(--display);color:var(--navy)\">Le pavé — pourquoi là<\u002Fh2>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\">iPad posé à plat, tenu d'aucune main : le doigt part du bord bas de la tablette. Je pousse donc le pavé <b>en bas, plein cadre<\u002Fb> (touches de 241 × 132 px, gouttière 16 px) et je réduis la question à ce qu'elle doit être : grande, mais compacte, dans le tiers haut.<\u002Fp>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\">Ordre <b>1‑2‑3 en haut<\u002Fb> : c'est le pavé du téléphone et celui d'iOS, déjà automatisé chez un collégien. Le 0 occupe deux colonnes au centre-bas — c'est le chiffre le plus tapé après un multiple de 10, il n'a pas à être visé.<\u002Fp>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\">Le <b>⌫ est isolé en bas à droite<\u002Fb>, séparé par une gouttière doublée (32 px) et posé en creux, pas en rouge : il ne doit ni attirer l'œil ni se prendre à la place du 0. La correction automatique après erreur fait le reste du travail.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:var(--muted)\"><b>Hypothèse à vérifier<\u002Fb> : la latéralité. Un droitier masque la colonne 3‑6‑9 avec sa main ; si l'observation le confirme, une bascule gauche/droite du ⌫ dans le profil coûte trois lignes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 460px;background:var(--surface);border-radius:28px;padding:32px;box-shadow:0 6px 16px rgba(32,34,107,.08);display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:700 26px var(--display);color:var(--navy)\">La fête, sans casser le rythme<\u002Fh2>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\">Trois intensités, jamais bloquantes :<\u002Fp>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\"><b>1 · Bonne réponse (180 ms)<\u002Fb> — les cases passent menthe, le nombre grossit d'un cran, six carrés du logo jaillissent derrière la carte. La question suivante arrive pendant l'animation : rien n'attend.<\u002Fp>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\"><b>2 · Série (à 5, 10, 15)<\u002Fb> — la barre de série se remplit d'un carré coloré de plus ; au palier, la mosaïque pulse une fois et le compteur claque. Aucune modale.<\u002Fp>\n        <p style=\"margin:0;font:400 18px/1.55 var(--sans);color:var(--navy-soft)\"><b>3 · Fin de partie réussie, badge, table débloquée<\u002Fb> — c'est là que ça pète : pluie de carrés, score qui compte de 0 à sa valeur, badge qui se retourne. Un seul écran, une seule fois, uniquement en cas de réussite.<\u002Fp>\n        <p style=\"margin:0;font:400 17px/1.5 var(--sans);color:var(--muted)\">L'erreur, elle, reste sobre : rouge + tremblement 200 ms, puis les cases se vident. Pas de son, pas de croix géante — l'erreur d'un collégien est une quas
