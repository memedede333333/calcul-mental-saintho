<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="matHo" />
    <meta name="description" content="matHo — Le défi des tables de multiplication. Collège Saint-Honoré d'Eylau." />
    <link rel="icon" type="image/png" href="/matho-favicon-32.png" />
    <link rel="apple-touch-icon" href="/matho-icone-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Polices servies localement depuis /fonts/ — voir src/styles/index.css -->
    <title>matHo — Le défi des tables</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Filet de sécurité pré-React : si une erreur bloque l'exécution des modules avant le montage de React -->
    <script>
      (function() {
        function declencherSecours() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center;">'
              + '<div style="background:#1e293b;border:1px solid #334155;border-radius:24px;padding:36px 28px;max-width:440px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.5);">'
              + '<div style="font-size:48px;margin-bottom:14px;">🦉</div>'
              + '<h1 style="font-size:22px;font-weight:700;margin:0 0 10px 0;color:#ffffff;">Chargement interrompu</h1>'
              + '<p style="font-size:15px;color:#94a3b8;line-height:1.5;margin:0 0 24px 0;">L\'application n\'a pas pu démarrer. Si le problème persiste, vérifiez la connexion de l\'iPad ou rechargez.</p>'
              + '<button onclick="window.location.reload()" style="background:#4338ca;color:#ffffff;border:none;border-radius:14px;padding:12px 28px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(67,56,202,0.4);">Recharger la page</button>'
              + '</div></div>';
          }
        }
        window.addEventListener('error', function() {
          setTimeout(declencherSecours, 1000);
        });
        window.addEventListener('unhandledrejection', function() {
          setTimeout(declencherSecours, 1000);
        });
        setTimeout(declencherSecours, 4500);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
